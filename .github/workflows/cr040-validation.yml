name: CR040 temporary validation

on:
  push:
    branches:
      - "change/CR040-professor-mari-personality-model"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CR040 compiler regression
        run: pnpm --filter @marinara-engine/server exec tsx ../../scripts/regressions/character-personality-model.regression.ts

      - name: Build shared package for server integration
        run: pnpm --filter @marinara-engine/shared build

      - name: Run CR040 Professor Mari regression
        run: pnpm --filter @marinara-engine/server exec tsx ../../scripts/regressions/professor-mari-personality-model.regression.ts

      - name: Run project checks
        run: pnpm check

      - name: Build
        run: pnpm build
